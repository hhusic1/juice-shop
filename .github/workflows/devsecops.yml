name: DevSecOps Pipeline - OWASP Juice Shop

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  devsecops:
    name: Security Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. TRUFFLEHOG
      - name: "TruffleHog - Secret Scanning"
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --json \
            --no-update \
            --only-verified \
            > trufflehog-report.json 2>&1 || true
          echo "=== TruffleHog rezultati ==="
          cat trufflehog-report.json || echo "Nema nalaza."

      - name: Upload TruffleHog rezultati
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-report
          path: trufflehog-report.json

      # 2. SEMGREP
      - name: "Semgrep - SAST analiza"
        run: |
          pip install semgrep --quiet
          semgrep --config=p/owasp-top-ten \
                  --config=p/nodejs \
                  --config=p/javascript \
                  --json \
                  --output semgrep-report.json \
                  . || true
          echo "Semgrep zavrsen."

      - name: Upload Semgrep rezultati
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

      # 3. OWASP DEPENDENCY-CHECK
      - name: "OWASP Dependency-Check - SCA"
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/reports:/report" \
            owasp/dependency-check:latest \
            --project "juice-shop" \
            --scan /src \
            --format HTML \
            --format JSON \
            --out /report \
            --failOnCVSS 7 \
            --enableRetired || true

      - name: Upload Dependency-Check rezultati
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

      # 4. DOCKER BUILD
      - name: "Docker - build image"
        run: docker build -t juice-shop:latest .

      # 5. TRIVY
      - name: "Trivy - skeniranje Docker image-a"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "juice-shop:latest"
          format: "table"
          exit-code: "0"
          severity: "HIGH,CRITICAL"
          output: trivy-report.txt

      - name: Upload Trivy rezultati
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt

      # 6. DOCKER RUN
      - name: "Pokreni Juice Shop kontejner"
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            juice-shop:latest
          echo "Cekam aplikaciju..."
          sleep 25
          curl --retry 10 --retry-delay 5 --retry-connrefused \
            http://localhost:3000 -o /dev/null -s \
            -w "HTTP status: %{http_code}\n"

      # 7. OWASP ZAP
      - name: "OWASP ZAP - DAST Baseline Scan"
        run: |
          mkdir -p zap-output
          chmod 777 zap-output
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-output:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -r zap-report.html \
            -J zap-report.json \
            -I || true

      - name: Upload ZAP rezultati
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            zap-output/zap-report.html
            zap-output/zap-report.json

      # 8. CLEANUP
      - name: Zaustavi kontejner
        if: always()
        run: docker stop juice-shop && docker rm juice-shop || true
